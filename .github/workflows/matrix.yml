name: build matrix

# Many builds in ONE run: build.yml (workflow_call) once per element of a JSON list.
# Each element = an object of build.yml workflow_call inputs (+ optional `name`, the artifact suffix);
# missing keys get build.yml's own workflow_call defaults (empty requirements / p4a_branch / archs =
# keep the app's spec_overrides.txt values: the workflow_dispatch form defaults do NOT apply here).
# Non-string values of string inputs are passed as compact JSON (so app_config may be an object).
# Artifacts: build-<run_number>-<name>-a<run_attempt>; the `facts` job (latest attempt per name) prints aapt2 facts of every APK in one table.
# Docs: docs/bisect.md (the Q-B kit's JSON). Inputs reach the shell through env: only.
on:
  workflow_dispatch:
    inputs:
      label:
        description: 'Run label (what question this answers)'
        default: 'matrix'
      builds:
        description: 'JSON list (1-8) of build.yml input objects, e.g. [{"name":"a","app":"stub_kivymd","app_config":{"variant":1}}]'
        required: true

run-name: '${{ inputs.label }} | matrix'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.v.outputs.builds }}
    steps:
      - name: Validate + normalize the build list
        id: v
        shell: bash
        env:
          BUILDS: ${{ inputs.builds }}
          LABEL: ${{ inputs.label }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          def fail(msg):
              print(f'::error::{msg}'); sys.exit(1)
          # MIRRORS build.yml's workflow_call inputs + defaults (a literal copy: keep in sync by hand;
          # artifact_name is set below; label gets '<run label> <name>'). Unknown keys are refused.
          DEFAULTS = {'label': '', 'runner': 'ubuntu-latest', 'image': 'ghcr.io/kivy/buildozer:latest',
                      'repo': '', 'ref': 'HEAD', 'app': '', 'requirements': '', 'p4a_branch': '',
                      'archs': '', 'add_archs': '', 'extra': '', 'app_config': '', 'patches': '',
                      'command': 'android debug', 'cache': 'off', 'apk_cache': False}
          raw = os.environ['BUILDS']
          if len(raw) > 20000:
              fail('builds JSON over 20000 characters')
          try:
              items = json.loads(raw)
          except ValueError as e:
              fail(f'builds is not valid JSON: {e}')
          if not isinstance(items, list) or not 1 <= len(items) <= 8:
              fail('builds must be a JSON list of 1 to 8 objects')
          out, names = [], set()
          for i, item in enumerate(items, 1):
              if not isinstance(item, dict):
                  fail(f'element {i} is not an object')
              unknown = set(item) - set(DEFAULTS) - {'name'}
              if unknown:
                  fail(f'element {i}: unknown keys {sorted(unknown)}')
              name = str(item.get('name', i))
              if not re.fullmatch(r'[A-Za-z0-9_.-]{1,40}', name) or name in names:
                  fail(f'element {i}: name must be unique, 1-40 of A-Z a-z 0-9 _ . -')
              names.add(name)
              el = dict(DEFAULTS, label=f"{os.environ['LABEL']} {name}")
              for key, value in item.items():
                  if key == 'name':
                      continue
                  if key == 'apk_cache':
                      if not isinstance(value, bool):
                          fail(f'element {i}: apk_cache must be true / false')
                  elif value is None:
                      value = ''
                  elif not isinstance(value, str):
                      value = json.dumps(value, separators=(',', ':'))
                  el[key] = value
              if el['runner'] not in ('ubuntu-latest', 'ubuntu-24.04-arm'):
                  fail(f'element {i}: runner must be ubuntu-latest or ubuntu-24.04-arm')
              if el['cache'] not in ('off', 'sdk', 'full'):
                  fail(f'element {i}: cache must be off, sdk or full')
              if not el['command'].strip():
                  fail(f'element {i}: empty command')
              el['name'] = name
              el['artifact_name'] = f"build-{os.environ['RUN_NUMBER']}-{name}"
              out.append(el)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('builds=' + json.dumps(out, separators=(',', ':')) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(f'## matrix: {len(out)} builds\n\n| name | artifact | app | app_config | extra | patches |\n|---|---|---|---|---|---|\n')
              for el in out:
                  cells = [el['name'], el['artifact_name'], el['repo'] or el['app'] or 'stub', el['app_config'], el['extra'], el['patches']]
                  f.write('| ' + ' | '.join('`' + c.replace('|', '/').replace('`', "'") + '`' for c in cells) + ' |\n')
          PY

  build:
    needs: check
    name: build ${{ matrix.b.name }}
    strategy:
      fail-fast: false
      # cold builds in parallel hit gradle / maven HTTP 429 rate limits; build.yml also retries once on a 429
      max-parallel: 4
      matrix:
        b: ${{ fromJSON(needs.check.outputs.builds) }}
    uses: ./.github/workflows/build.yml
    with:
      label: ${{ matrix.b.label }}
      runner: ${{ matrix.b.runner }}
      image: ${{ matrix.b.image }}
      repo: ${{ matrix.b.repo }}
      ref: ${{ matrix.b.ref }}
      app: ${{ matrix.b.app }}
      requirements: ${{ matrix.b.requirements }}
      p4a_branch: ${{ matrix.b.p4a_branch }}
      archs: ${{ matrix.b.archs }}
      add_archs: ${{ matrix.b.add_archs }}
      extra: ${{ matrix.b.extra }}
      app_config: ${{ matrix.b.app_config }}
      patches: ${{ matrix.b.patches }}
      command: ${{ matrix.b.command }}
      cache: ${{ matrix.b.cache }}
      apk_cache: ${{ matrix.b.apk_cache }}
      artifact_name: ${{ matrix.b.artifact_name }}

  # One table of aapt2 facts over every APK the matrix produced (missing = that build failed).
  facts:
    needs: [check, build]
    if: always() && needs.check.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Download all build artifacts of this run
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: build-${{ github.run_number }}-*
          path: arts

      - name: aapt2 facts
        env:
          BUILDS: ${{ needs.check.outputs.builds }}
        run: |
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          {
            echo '## APK facts (aapt2 badging)'
            echo
            echo '| name | apk | package | version | targetSdk | minSdk | ABIs | sha256 (16) |'
            echo '|---|---|---|---|---|---|---|---|'
            printf '%s' "$BUILDS" | python3 -c 'import json,sys; [print(e["name"], e["artifact_name"]) for e in json.load(sys.stdin)]' |
            while read -r name art; do
              dir=$(ls -d "arts/$art"-a* 2>/dev/null | sort -V | tail -1 || true)  # latest attempt
              apk=''
              [ -z "$dir" ] || apk=$(find "$dir" -name '*.apk' 2>/dev/null | sort | head -1 || true)
              if [ -z "$apk" ]; then echo "| $name | no APK (build failed?) | | | | | | |"; continue; fi
              b=$("$aapt2" dump badging "$apk" 2>/dev/null || true)
              pkg=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$b")
              ver=$(sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p" <<< "$b")
              tsdk=$(sed -n "s/^targetSdkVersion:'\([0-9]*\)'.*/\1/p" <<< "$b")
              msdk=$(sed -n "s/^\(minSdkVersion\|sdkVersion\):'\([0-9]*\)'.*/\2/p" <<< "$b" | head -1)
              abis=$(sed -n "s/^native-code: //p" <<< "$b" | tr -d "'")
              sha=$(sha256sum "$apk" | cut -c1-16)
              echo "| $name | \`$(basename "$apk")\` | \`$pkg\` | $ver | $tsdk | $msdk | $abis | \`$sha\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
