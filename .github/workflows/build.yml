name: buildozer repro

# One form, any "my buildozer build broke" question.
# Inputs -> a buildozer.spec -> a build -> a log (+ the APK).
# Spec = the app's own buildozer.spec, else the image's `buildozer init` default;
# then the app dir's spec_overrides.txt (if any); then the non-empty form inputs; then `extra`.
# Also a reusable workflow (workflow_call): inspect.yml builds through it.
# Every input reaches the shell through env: variables, never ${{ inputs.x }} inside run:.
on:
  workflow_dispatch:
    inputs:
      label:
        description: 'Run label (what question this answers)'
        default: 'repro'
      runner:
        description: 'Build host'
        type: choice
        options: [ubuntu-latest, ubuntu-24.04-arm]
        default: ubuntu-latest
      image:
        description: 'Buildozer container image'
        default: 'ghcr.io/kivy/buildozer:latest'
      repo:
        description: 'Public GitHub repo owner/name to build (empty = an app dir of THIS repo)'
        default: ''
      ref:
        description: 'Branch, tag or commit of repo'
        default: 'HEAD'
      app:
        description: 'App dir (holds main.py): in this repo when repo is empty (default stub), else in repo (default .)'
        default: ''
      requirements:
        description: 'requirements = (empty = keep the app spec / spec_overrides.txt value)'
        default: 'python3,kivy'
      p4a_branch:
        description: 'p4a.branch = (empty = keep)'
        default: 'master'
      archs:
        description: 'android.archs = (empty = keep)'
        default: 'arm64-v8a, armeabi-v7a'
      add_archs:
        description: 'Archs appended to android.archs if missing (e.g. x86_64 for an emulator)'
        default: ''
      extra:
        description: 'More spec overrides, ; separated (e.g. android.api=36;android.ndk=29)'
        default: ''
      app_config:
        description: 'JSON written to app_config.json next to main.py (empty = none); stub_kivymd reads it'
        default: ''
      patches:
        description: 'Diffs of THIS repo applied (git apply) to the built source before the spec, ; separated (patches/<...>.diff)'
        default: ''
      command:
        description: 'buildozer command'
        default: 'android debug'
      cache:
        description: 'Cache (see CLAUDE.md protocol): off = cold, only cold runs are evidence; sdk = ~/.buildozer; full = + project .buildozer'
        type: choice
        options: ['off', 'sdk', 'full']
        default: 'off'
      apk_cache:
        description: 'Reuse a cached APK built from exactly the same inputs (skips the build; never evidence)'
        type: boolean
        default: false
  workflow_call:
    inputs:
      label: {type: string, default: 'repro'}
      runner: {type: string, default: 'ubuntu-latest'}
      image: {type: string, default: 'ghcr.io/kivy/buildozer:latest'}
      repo: {type: string, default: ''}
      ref: {type: string, default: 'HEAD'}
      app: {type: string, default: ''}
      requirements: {type: string, default: ''}
      p4a_branch: {type: string, default: ''}
      archs: {type: string, default: ''}
      add_archs: {type: string, default: ''}
      extra: {type: string, default: ''}
      app_config: {type: string, default: ''}
      patches: {type: string, default: ''}
      command: {type: string, default: 'android debug'}
      cache: {type: string, default: 'off'}
      apk_cache: {type: boolean, default: false}
      # empty = build-<run_number>; set (matrix.yml, one per element) = <artifact_name>-a<run_attempt>,
      # so re-running failed jobs does not clash with the first attempt's artifact
      artifact_name: {type: string, default: ''}
    outputs:
      artifact: {value: '${{ jobs.build.outputs.artifact }}'}
      apk_hit: {value: '${{ jobs.build.outputs.apk_hit }}'}
      cold: {value: '${{ jobs.build.outputs.cold }}'}
      caches: {value: '${{ jobs.build.outputs.caches }}'}
      image_digest: {value: '${{ jobs.build.outputs.image_digest }}'}
      src_id: {value: '${{ jobs.build.outputs.src_id }}'}

run-name: '${{ inputs.label }} | ${{ inputs.runner }} | ${{ inputs.repo || inputs.app || ''stub'' }} | p4a ${{ inputs.p4a_branch }} | ${{ inputs.requirements }} | cache ${{ inputs.cache }}'

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      LABEL: ${{ inputs.label }}
      RUNNER_NAME_IN: ${{ inputs.runner }}
      IMAGE: ${{ inputs.image || 'ghcr.io/kivy/buildozer:latest' }}  # empty (inspect.yml passes it as is) = the default
      REPO: ${{ inputs.repo }}
      REF: ${{ inputs.ref }}
      APP: ${{ inputs.app }}
      REQUIREMENTS: ${{ inputs.requirements }}
      P4A_BRANCH: ${{ inputs.p4a_branch }}
      ARCHS: ${{ inputs.archs }}
      ADD_ARCHS: ${{ inputs.add_archs }}
      EXTRA: ${{ inputs.extra }}
      APP_CONFIG: ${{ inputs.app_config }}
      PATCHES: ${{ inputs.patches }}
      COMMAND: ${{ inputs.command }}
      CACHE: ${{ inputs.cache }}
      APK_CACHE: ${{ inputs.apk_cache }}
    outputs:
      artifact: ${{ inputs.artifact_name && format('{0}-a{1}', inputs.artifact_name, github.run_attempt) || format('build-{0}', github.run_number) }}
      apk_hit: ${{ steps.apk_restore.outputs.cache-hit == 'true' }}
      cold: ${{ steps.out.outputs.cold }}
      caches: ${{ steps.out.outputs.caches }}
      image_digest: ${{ steps.out.outputs.image_digest }}
      src_id: ${{ steps.out.outputs.src_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk (SDK + NDK need room)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Pull image, record digest
        run: |
          docker pull "$IMAGE"
          echo "IMAGE_DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE" | tr -d '\r\n')" >> "$GITHUB_ENV"
          echo "HOST_ARCH=$(uname -m)" >> "$GITHUB_ENV"

      # SRC_ID = what was built: repo@resolved-sha:app, or local:<app>:<hash of its tracked files>.
      - name: Resolve source
        run: |
          case "$APP" in *..*|/*) echo "bad app dir: $APP"; exit 1;; esac
          [[ "$APP" =~ ^[A-Za-z0-9_./-]*$ ]] || { echo "bad app dir: $APP"; exit 1; }
          if [ -n "$REPO" ]; then
            [[ "$REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "bad repo: $REPO"; exit 1; }
            [[ "$REF" =~ ^[A-Za-z0-9_./-]+$ ]] || { echo "bad ref: $REF"; exit 1; }
            git init -q src
            git -C src fetch -q --depth 1 "https://github.com/$REPO" "$REF"
            git -C src checkout -q FETCH_HEAD
            sha=$(git -C src rev-parse HEAD)
            dir="src/${APP:-.}"
            id="$REPO@$sha:${APP:-.}"
          else
            dir="${APP:-stub}"
            id="local:$dir:$(git ls-files -s -- "$dir" | sha256sum | cut -c1-16)"
          fi
          [ -f "$dir/main.py" ] || { echo "no main.py in $dir"; exit 1; }
          echo "APP_DIR=$dir" >> "$GITHUB_ENV"
          echo "SRC_ID=$id" >> "$GITHUB_ENV"
          echo "source: $id"

      # patches: each a diff in THIS repo (patches/...diff), applied in order with git apply in the
      # source tree being built (the fetched repo's root, else this repo's root). Any failure fails the run.
      # PATCH_ID (hash of the path + sha256 list) joins the cache keys; patches_applied.txt feeds the summary.
      - name: Apply patches
        run: |
          : > patches_applied.txt
          echo "PATCH_ID=none" >> "$GITHUB_ENV"
          [ -n "$PATCHES" ] || { echo 'no patches'; exit 0; }
          if [ -n "$REPO" ]; then tree=src; else tree=.; fi
          IFS=';' read -r -a list <<< "$PATCHES"
          n=0
          for p in "${list[@]}"; do
            p=$(printf '%s' "$p" | tr -d '[:space:]')
            [ -n "$p" ] || continue
            case "$p" in *..*) echo "::error::bad patch path (..): $p"; exit 1;; esac
            [[ "$p" =~ ^patches/[A-Za-z0-9._/-]+\.diff$ ]] || { echo "::error::bad patch path (want patches/<name>.diff): $p"; exit 1; }
            [ -f "$p" ] || { echo "::error::no such patch in this repo: $p"; exit 1; }
            sha=$(sha256sum "$p" | cut -c1-64)
            echo "applying $p (sha256 $sha) in $tree"
            git -C "$tree" apply --verbose "$GITHUB_WORKSPACE/$p" || { echo "::error::git apply failed: $p"; exit 1; }
            echo "$p $sha" >> patches_applied.txt
            n=$((n + 1))
          done
          echo "PATCH_ID=$(sha256sum patches_applied.txt | cut -c1-16)" >> "$GITHUB_ENV"
          echo "$n patch(es) applied"

      # Exact keys only, no restore-keys: a cache from different inputs must never be restored.
      - name: Cache keys
        id: ck
        if: inputs.cache != 'off' || inputs.apk_cache
        run: |
          h() { printf '%s|' "$@" | sha256sum | cut -c1-16; }
          echo "sdk=bz-sdk-$RUNNER_OS-$RUNNER_ARCH-$(h "$IMAGE_DIGEST" "$EXTRA")" >> "$GITHUB_OUTPUT"
          echo "full=bz-full-$RUNNER_OS-$RUNNER_ARCH-$(h "$IMAGE_DIGEST" "$EXTRA" "$ARCHS" "$ADD_ARCHS" "$P4A_BRANCH" "$REQUIREMENTS" "$SRC_ID" "$APP_CONFIG" "$PATCH_ID")" >> "$GITHUB_OUTPUT"
          echo "apk=bz-apk-$RUNNER_OS-$RUNNER_ARCH-$(h "$IMAGE_DIGEST" "$SRC_ID" "$REQUIREMENTS" "$P4A_BRANCH" "$ARCHS" "$ADD_ARCHS" "$EXTRA" "$APP_CONFIG" "$COMMAND" "$PATCH_ID")" >> "$GITHUB_OUTPUT"

      - name: Restore built APK (apk_cache)
        id: apk_restore
        if: inputs.apk_cache
        uses: actions/cache/restore@v4
        with:
          path: work/bin
          key: ${{ steps.ck.outputs.apk }}

      - name: Restore ~/.buildozer (sdk)
        id: sdk_restore
        if: inputs.cache != 'off' && steps.apk_restore.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: ${{ steps.ck.outputs.sdk }}

      - name: Restore project .buildozer (full)
        id: full_restore
        if: inputs.cache == 'full' && steps.apk_restore.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: work/.buildozer
          key: ${{ steps.ck.outputs.full }}

      - name: Make spec (app spec, root spec with source.dir = app, or buildozer init; then overrides)
        if: steps.apk_restore.outputs.cache-hit != 'true'
        run: |
          mkdir -p work cache
          sudo chmod -R a+rwX work cache
          (cd "$APP_DIR" && tar --exclude=.git --exclude=.buildozer --exclude=bin -cf - .) | tar -C work -xf -
          # base spec, first found: (1) the app dir's own buildozer.spec; (2) the source root's
          # buildozer.spec (fetched repo root, else this repo's root) when its [app] source.dir is the app
          # dir (the common "spec at the root, code in source.dir" layout), copied with source.dir = .
          # (work/ holds the app dir's contents); (3) buildozer init. Patches were applied before this step.
          if [ -n "$REPO" ]; then root=src; else root=.; fi
          if [ -f work/buildozer.spec ]; then
            base="the app dir's own buildozer.spec"
          elif [ "$(realpath "$APP_DIR")" != "$(realpath "$root")" ] && [ -f "$root/buildozer.spec" ] && [ ! -L "$root/buildozer.spec" ]; then
            # UNTRUSTED file: prints line 1 = source.dir (only [A-Za-z0-9_./-], else '(unsafe value)'),
            # line 2 = names (fixed list) of keys whose relative paths would break in work/. Exit 3 = unreadable.
            info=$(python3 - "$root/buildozer.spec" <<'PY'
          import configparser, re, sys
          c = configparser.ConfigParser(allow_no_value=True, strict=False, interpolation=None)
          try:
              c.read(sys.argv[1], encoding='utf-8')
              sd = (c.get('app', 'source.dir', fallback='.') or '.').strip()
          except Exception:
              sys.exit(3)
          print(sd if re.fullmatch(r'[A-Za-z0-9_./-]{1,200}', sd) else '(unsafe value)')
          keys = ['p4a.local_recipes', 'p4a.hook', 'icon.filename', 'presplash.filename', 'icon.adaptive_foreground.filename',
                  'icon.adaptive_background.filename', 'android.add_src', 'android.add_resources', 'android.add_assets',
                  'android.add_jars', 'android.add_aars', 'android.add_libs_armeabi_v7a', 'android.add_libs_arm64_v8a',
                  'android.add_libs_x86_64', 'android.res_xml', 'android.manifest_placeholders', 'android.extra_manifest_xml']
          found = [k for k in keys if c.has_option('app', k) and '%(source.dir)s' not in (c.get('app', k) or '')]
          print(' '.join(found))
          PY
            ) || info='(unreadable)'
            sd=$(printf '%s\n' "$info" | sed -n 1p)
            pathkeys=$(printf '%s\n' "$info" | sed -n 2p)
            # belt and braces: never let spec text reach a later step unvalidated
            [[ "$sd" =~ ^[A-Za-z0-9_./-]{1,200}$ ]] || { [ "$sd" = '(unreadable)' ] || sd='(unsafe value)'; }
            [[ "$pathkeys" =~ ^[a-z0-9_.\ ]*$ ]] || pathkeys=''
            if [[ "$sd" =~ ^[A-Za-z0-9_./-]{1,200}$ ]] && [[ "$sd" != /* ]] && [ -d "$root/$sd" ] &&
               [ "$(realpath "$root/$sd")" = "$(realpath "$APP_DIR")" ]; then
              cp "$root/buildozer.spec" work/buildozer.spec
              python3 tools/patch_spec.py work/buildozer.spec 'source.dir=.'
              base="repo root buildozer.spec (source.dir=$sd)"
              if [ -n "$pathkeys" ]; then
                echo "::warning::root spec copied into the app dir build: these keys hold paths relative to the repo root that are NOT rewritten and may break: $pathkeys"
                base="$base; WARNING, paths not rewritten: $pathkeys"
              fi
            elif [ "$sd" = '(unreadable)' ]; then
              base='buildozer init (image default): the repo root buildozer.spec could not be read (configparser error)'
            else
              base="buildozer init (image default): the repo root buildozer.spec has source.dir=$sd, not the app dir ${APP:-.}"
            fi
          else
            base='buildozer init (image default)'
          fi
          echo "base spec: $base"
          # one line, no CR / LF: a newline in a GITHUB_ENV value would define more variables
          printf 'BASE_SPEC=%s\n' "$(printf '%s' "$base" | tr -d '\r\n')" >> "$GITHUB_ENV"
          [[ "$base" != 'buildozer init'* ]] || docker run --rm -v "$PWD/work:/home/user/hostcwd" "$IMAGE" init
          sudo chmod -R a+rwX work
          args=()
          if [ -f work/spec_overrides.txt ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              [[ "$line" =~ ^[[:space:]]*(#|$) ]] || args+=("$line")
            done < work/spec_overrides.txt
          fi
          [ -z "$REQUIREMENTS" ] || args+=("requirements=$REQUIREMENTS")
          [ -z "$P4A_BRANCH" ] || args+=("p4a.branch=$P4A_BRANCH")
          [ -z "$ARCHS" ] || args+=("android.archs=$ARCHS")
          args+=('android.accept_sdk_license=True' 'warn_on_root=0' 'log_level=2' "$EXTRA")
          [ -z "$ADD_ARCHS" ] || args+=("android.archs+=$ADD_ARCHS")
          if [ -n "$APP_CONFIG" ]; then
            printf '%s\n' "$APP_CONFIG" | python3 -c 'import json,sys; json.load(sys.stdin)' || { echo 'app_config is not valid JSON'; exit 1; }
            printf '%s\n' "$APP_CONFIG" > work/app_config.json
            args+=('source.include_exts+=json')
          fi
          # spec values come from the built repo: workflow commands off while they are printed
          token=$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')
          echo "::stop-commands::$token"
          python3 tools/patch_spec.py work/buildozer.spec "${args[@]}"
          echo '--- effective spec (non-comment lines) ---'
          grep -vE '^\s*(#|$)' work/buildozer.spec
          echo "::$token::"

      # One retry, only when the log shows an HTTP 429 (gradle / maven rate limit on parallel cold
      # builds, e.g. a matrix): wait 60-120 s, keep attempt 1's log as build_attempt1.log, build again.
      - name: Build
        if: steps.apk_restore.outputs.cache-hit != 'true'
        run: |
          read -r -a cmd <<< "$COMMAND"
          # the build prints UNTRUSTED text (the built repo's code runs): workflow commands are off while it runs
          run_build() {
            local rc=0 token
            token=$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')
            echo "::stop-commands::$token"
            docker run --rm \
              -v "$PWD/cache:/home/user/.buildozer" \
              -v "$PWD/work:/home/user/hostcwd" \
              "$IMAGE" "${cmd[@]}" 2>&1 | tee build.log || rc=$?
            echo "::$token::"
            return "$rc"
          }
          if run_build; then exit 0; fi
          if grep -qiE '(status code|HTTP|response code)[ :]*429|429 Too Many Requests' build.log; then
            wait_s=$((60 + RANDOM % 61))
            echo "::warning::build failed with HTTP 429 in the log: retrying once in $wait_s s (attempt 1 log: build_attempt1.log)"
            mv build.log build_attempt1.log
            sudo chmod -R a+rwX work cache || true
            sleep "$wait_s"
            run_build
          else
            exit 1
          fi

      - name: Make cache dirs readable for saving
        if: always() && (inputs.cache != 'off' || inputs.apk_cache)
        run: sudo chmod -R a+rwX work cache || true

      # sdk: saved even when the build fails (SDK/NDK downloads are still good).
      - name: Save ~/.buildozer (sdk)
        if: always() && inputs.cache != 'off' && steps.sdk_restore.outcome == 'success' && steps.sdk_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: cache
          key: ${{ steps.ck.outputs.sdk }}

      # full: saved only after a successful build, so a broken build dir is never reused.
      - name: Save project .buildozer (full)
        if: success() && inputs.cache == 'full' && steps.full_restore.outcome == 'success' && steps.full_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: work/.buildozer
          key: ${{ steps.ck.outputs.full }}

      - name: Save built APK (apk_cache, success only)
        if: success() && inputs.apk_cache && steps.apk_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: work/bin
          key: ${{ steps.ck.outputs.apk }}

      # COLD/WARM follows what was ACTUALLY restored (cache-hit outputs), not the cache input:
      # cache=sdk with a missed key restored nothing, so the run is cold. Empty cache-hit = miss.
      - name: Outputs
        id: out
        if: always()
        env:
          APK_HIT: ${{ steps.apk_restore.outputs.cache-hit }}
          SDK_HIT: ${{ steps.sdk_restore.outputs.cache-hit }}
          FULL_HIT: ${{ steps.full_restore.outputs.cache-hit }}
          APK_KEY: ${{ steps.ck.outputs.apk }}
          SDK_KEY: ${{ steps.ck.outputs.sdk }}
          FULL_KEY: ${{ steps.ck.outputs.full }}
        run: |
          # state <used> <hit> <skipped-by-apk-hit>
          st() { if [ "$1" != 'true' ]; then echo 'not used'; elif [ "$2" = 'true' ]; then echo 'HIT';
                 elif [ "$3" = 'true' ]; then echo 'skipped (apk hit)'; else echo 'MISS'; fi; }
          apk_hit=false; if [ "$APK_HIT" = 'true' ]; then apk_hit=true; fi
          sdk_used=false; if [ "$CACHE" != 'off' ]; then sdk_used=true; fi
          full_used=false; if [ "$CACHE" = 'full' ]; then full_used=true; fi
          apk_st=$(st "$APK_CACHE" "$APK_HIT" false)
          sdk_st=$(st "$sdk_used" "$SDK_HIT" "$apk_hit")
          full_st=$(st "$full_used" "$FULL_HIT" "$apk_hit")
          cold=true
          for x in "$APK_HIT" "$SDK_HIT" "$FULL_HIT"; do if [ "$x" = 'true' ]; then cold=false; fi; done
          # one entry: <level>: <state> (<key>), key only when that cache was used
          ent() { if [ "$2" = 'not used' ]; then echo "$1: $2"; else echo "$1: $2 ($3)"; fi; }
          caches="$(ent sdk "$sdk_st" "$SDK_KEY"); $(ent full "$full_st" "$FULL_KEY"); $(ent apk "$apk_st" "$APK_KEY")"
          echo "cold=$cold" >> "$GITHUB_OUTPUT"
          echo "caches=$caches" >> "$GITHUB_OUTPUT"
          echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "src_id=$SRC_ID" >> "$GITHUB_OUTPUT"
          echo "cache input: $CACHE, apk_cache: $APK_CACHE"
          echo "caches: $caches"
          if [ "$cold" = 'true' ]; then echo 'COLD: nothing restored from any cache'; else echo 'WARM: a cache was restored'; fi

      - name: Summary
        if: always()
        env:
          APK_HIT: ${{ steps.apk_restore.outputs.cache-hit }}
          COLD: ${{ steps.out.outputs.cold }}
          CACHES: ${{ steps.out.outputs.caches }}
        run: |
          {
            echo "## build: $LABEL"
            if [ "$COLD" = 'true' ]; then verdict='**COLD RUN (nothing restored from any cache): counts as evidence**'; else verdict='**WARM RUN (a cache was restored): not evidence (CLAUDE.md)**'; fi
            echo "- $verdict"
            echo "- cache input: \`$CACHE\`, apk_cache: \`$APK_CACHE\`; per cache: $CACHES"
            echo "- host: \`$HOST_ARCH\` ($RUNNER_NAME_IN)"
            echo "- image: \`$IMAGE_DIGEST\`"
            echo "- source: \`$SRC_ID\`"
            echo "- requirements: \`$REQUIREMENTS\`, p4a: \`$P4A_BRANCH\`, archs: \`$ARCHS\` (+ \`$ADD_ARCHS\`)  (empty = the app's own value)"
            echo "- extra: \`$EXTRA\`; app_config: \`$APP_CONFIG\`"
            echo "- base spec: ${BASE_SPEC:-n/a (no spec step: APK restored or failed earlier)}"
            if [ -s patches_applied.txt ]; then
              echo "- patches applied (in order, git apply in the source tree):"
              while read -r p sha; do echo "  - \`$p\` sha256 \`$sha\`"; done < patches_applied.txt
            else
              echo "- patches: none"
            fi
            [ ! -f build_attempt1.log ] || echo '- **build retried once after an HTTP 429 in attempt 1** (build_attempt1.log in the artifact)'
            if [ "$APK_HIT" = 'true' ]; then echo '- build skipped: APK restored from the apk cache'; exit 0; fi
            echo '### pip versions seen'
            echo '```'
            grep -oE '(Successfully installed|Requirement already satisfied:) pip[^ ]*( in [^ ]*)?( \([0-9.]+\))?|pip-[0-9][0-9.]*' build.log 2>/dev/null | sort | uniq -c | head -20 || true
            echo '```'
            echo '### last commands before first error (40 lines)'
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' build.log > clean.log 2>/dev/null || true
            # real failure markers first; earlier Tracebacks in p4a logs are often harmless noise
            # || true: no match must not fail the step (bash -eo pipefail)
            line=$(grep -nE 'ImportError|ModuleNotFoundError|BUILD FAILURE|Buildozer failed|Command failed' clean.log 2>/dev/null | head -1 | cut -d: -f1 || true)
            [ -n "$line" ] || line=$(grep -n 'Traceback' clean.log 2>/dev/null | tail -1 | cut -d: -f1 || true)
            if [ -n "$line" ]; then start=$(( line > 40 ? line - 40 : 1 )); sed -n "${start},$((line + 15))p" clean.log | cut -c1-300; else echo 'no error found'; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log + apk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name && format('{0}-a{1}', inputs.artifact_name, github.run_attempt) || format('build-{0}', github.run_number) }}
          path: |
            build.log
            build_attempt1.log
            patches_applied.txt
            work/buildozer.spec
            work/bin/*.apk
          retention-days: 14
          if-no-files-found: ignore
