name: inspect apk

# Inspect an Android APK on GitHub: static facts (aapt2 + bundled Python packages), and
# optionally a headless run on an x86_64 emulator with taps + screenshots + the runner's OWN logcat.
# Screenshots are pushed to the orphan branch `shots` (shots/<run_id>/) so raw URLs unfurl in Discord.
# The emulator renders in SOFTWARE (SwiftShader): GPU-driver / hardware bugs cannot show up here.
# APK source (exactly one): apk_url, OR artifact_run + artifact_name (an APK artifact of another run of
# THIS repo, e.g. a matrix.yml build; no rebuild), OR a build through build.yml (neither set).
# Docs: docs/inspect.md. Every input reaches the shell through env: variables only.
on:
  workflow_dispatch:
    inputs:
      label:
        description: 'Run label (what question this answers)'
        default: 'inspect'
      apk_url:
        description: 'https URL of an APK to inspect (set = no build; empty = artifact below or build repo/app)'
        default: ''
      artifact_run:
        description: 'Run ID (number in the run URL) of another run of THIS repo whose artifact holds the APK (set = no build)'
        default: ''
      artifact_name:
        description: 'Artifact name in that run, e.g. build-12-bisect1-a1 (exactly one .apk inside)'
        default: ''
      repo:
        description: 'Public GitHub repo owner/name to build (empty = an app dir of THIS repo)'
        default: ''
      ref:
        description: 'Branch, tag or commit of repo'
        default: 'HEAD'
      app:
        description: 'App dir: in this repo when repo is empty (default stub_kivymd), else in repo (default .)'
        default: ''
      archs:
        description: 'android.archs = (empty = the app''s own); x86_64 is added unless static_only'
        default: ''
      extra:
        description: 'Spec overrides, ; separated (e.g. android.api=35;p4a.branch=develop)'
        default: ''
      app_config:
        description: 'JSON baked as app_config.json (stub_kivymd: {"shadows": false, "transition": "Fade"})'
        default: ''
      static_only:
        description: 'Static facts only (no emulator)'
        type: boolean
        default: false
      api_level:
        description: 'Emulator API level (x86_64 google_apis image)'
        default: '35'
      profile:
        description: 'Emulator device profile (avdmanager id; pixel_6 = 1080x2400)'
        default: 'pixel_6'
      taps:
        description: 'Tap steps x,y[,wait_s] separated by ; (screenshot after launch and after each tap)'
        default: ''
      launch_wait:
        description: 'Seconds to wait after launch before the first screenshot'
        default: '30'
      cache:
        description: 'off = cold (evidence); sdk / full = build caches + the built-APK cache (warm, not evidence)'
        type: choice
        options: ['off', 'sdk', 'full']
        default: 'off'
      image:
        description: 'Buildozer container image'
        default: 'ghcr.io/kivy/buildozer:latest'

run-name: '${{ inputs.label }} | inspect | ${{ inputs.apk_url != '''' && ''apk_url'' || inputs.artifact_run != '''' && format(''artifact {0}'', inputs.artifact_name) || (inputs.repo || inputs.app || ''stub_kivymd'') }} | api ${{ inputs.api_level }} | cache ${{ inputs.cache }}'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.v.outputs.app }}
      add_archs: ${{ steps.v.outputs.add_archs }}
      source: ${{ steps.v.outputs.source }}  # build | apk_url | artifact
      artifact_run: ${{ steps.v.outputs.artifact_run }}
      artifact_name: ${{ steps.v.outputs.artifact_name }}
    steps:
      - name: Validate inputs
        id: v
        shell: bash
        env:
          APK_URL: ${{ inputs.apk_url }}
          ARTIFACT_RUN: ${{ inputs.artifact_run }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          REPO: ${{ inputs.repo }}
          REF: ${{ inputs.ref }}
          APP: ${{ inputs.app }}
          ARCHS: ${{ inputs.archs }}
          EXTRA: ${{ inputs.extra }}
          APP_CONFIG: ${{ inputs.app_config }}
          IMAGE: ${{ inputs.image }}
          CACHE: ${{ inputs.cache }}
          API_LEVEL: ${{ inputs.api_level }}
          PROFILE: ${{ inputs.profile }}
          LAUNCH_WAIT: ${{ inputs.launch_wait }}
          TAPS: ${{ inputs.taps }}
          STATIC_ONLY: ${{ inputs.static_only }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ -z "$APK_URL" ] || [[ "$APK_URL" =~ ^https://[^[:space:]\'\"\`]+$ ]] || fail 'apk_url must be one https URL'
          [[ "$API_LEVEL" =~ ^[0-9]{2}$ ]] || fail 'api_level must be a number like 35'
          [[ "$PROFILE" =~ ^[A-Za-z0-9_.-]+$ ]] || fail 'bad profile'
          [[ "$LAUNCH_WAIT" =~ ^[0-9]{1,3}$ ]] || fail 'launch_wait must be whole seconds'
          [[ "$TAPS" =~ ^[0-9,.\;\ ]*$ ]] || fail 'taps: only x,y[,wait_s] steps separated by ;'
          # APK source: exactly one of apk_url / artifact_run + artifact_name / a build
          [ -z "$ARTIFACT_RUN" ] || [[ "$ARTIFACT_RUN" =~ ^[1-9][0-9]{0,19}$ ]] || fail 'artifact_run must be a numeric run ID (the number in .../actions/runs/<id>)'
          [ -z "$ARTIFACT_NAME" ] || [[ "$ARTIFACT_NAME" =~ ^[A-Za-z0-9._-]{1,100}$ ]] || fail 'artifact_name: 1-100 of A-Z a-z 0-9 . _ -'
          if [ -n "$ARTIFACT_RUN" ] && [ -z "$ARTIFACT_NAME" ]; then fail 'artifact_run needs artifact_name'; fi
          if [ -z "$ARTIFACT_RUN" ] && [ -n "$ARTIFACT_NAME" ]; then fail 'artifact_name needs artifact_run'; fi
          if [ -n "$APK_URL" ] && [ -n "$ARTIFACT_RUN" ]; then fail 'set apk_url OR artifact_run + artifact_name, not both'; fi
          source=build
          [ -z "$APK_URL" ] || source=apk_url
          [ -z "$ARTIFACT_RUN" ] || source=artifact
          if [ "$source" != build ]; then
            # build inputs would be silently ignored: refuse them instead
            set_build=''
            for v in REPO APP ARCHS EXTRA APP_CONFIG; do [ -z "${!v}" ] || set_build="$set_build ${v,,}"; done
            [ "$REF" = 'HEAD' ] || [ -z "$REF" ] || set_build="$set_build ref"
            # no build = no image and no cache: a non-default value would be claimed in the run name / summary
            [ "$IMAGE" = 'ghcr.io/kivy/buildozer:latest' ] || [ -z "$IMAGE" ] || set_build="$set_build image"
            [ "$CACHE" = 'off' ] || [ -z "$CACHE" ] || set_build="$set_build cache"
            [ -z "$set_build" ] || fail "$source is set (= no build): leave the build inputs empty / default:$set_build"
          fi
          { echo "source=$source"; echo "artifact_run=$ARTIFACT_RUN"; echo "artifact_name=$ARTIFACT_NAME"; } >> "$GITHUB_OUTPUT"
          if [ -n "$REPO" ]; then app="${APP:-.}"; else app="${APP:-stub_kivymd}"; fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          if [ "$STATIC_ONLY" = 'true' ]; then echo 'add_archs=' >> "$GITHUB_OUTPUT"; else echo 'add_archs=x86_64' >> "$GITHUB_OUTPUT"; fi

  build:
    needs: check
    if: needs.check.outputs.source == 'build'
    uses: ./.github/workflows/build.yml
    with:
      label: ${{ inputs.label }}
      image: ${{ inputs.image }}
      repo: ${{ inputs.repo }}
      ref: ${{ inputs.ref }}
      app: ${{ needs.check.outputs.app }}
      archs: ${{ inputs.archs }}
      add_archs: ${{ needs.check.outputs.add_archs }}
      extra: ${{ inputs.extra }}
      app_config: ${{ inputs.app_config }}
      cache: ${{ inputs.cache }}
      apk_cache: ${{ inputs.cache != 'off' }}

  # artifact source only: the ONE job with `actions: read` (reading another run's artifacts). It checks
  # the artifact (exactly one .apk; an x86_64 lib unless static_only) and re-uploads that APK as an
  # artifact of THIS run, so the inspect job takes it by the same path as a built APK, permission-free.
  fetch:
    needs: check
    if: needs.check.outputs.source == 'artifact'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      artifact: apk-input-${{ github.run_number }}-a${{ github.run_attempt }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Download the artifact of the other run
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.check.outputs.artifact_name }}
          run-id: ${{ needs.check.outputs.artifact_run }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: srcart

      - name: Explain a failed download
        if: failure()
        env:
          ARTIFACT_RUN: ${{ needs.check.outputs.artifact_run }}
          ARTIFACT_NAME: ${{ needs.check.outputs.artifact_name }}
        run: |
          msg="could not download artifact $ARTIFACT_NAME of run $ARTIFACT_RUN: artifact_run must be the run ID (the long number in the run URL), not the run number; artifacts expire after 14 days; the artifact name must match build-<run_number>-<name>-a<attempt>"
          echo "::error::$msg"
          echo "**FETCH FAILED:** $msg" >> "$GITHUB_STEP_SUMMARY"

      - name: Exactly one APK; x86_64 lib for the emulator
        env:
          STATIC_ONLY: ${{ inputs.static_only }}
          ARTIFACT_RUN: ${{ needs.check.outputs.artifact_run }}
          ARTIFACT_NAME: ${{ needs.check.outputs.artifact_name }}
        run: |
          fail() { echo "::error::$1"; echo "**FETCH FAILED:** $1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          mapfile -t apks < <(find srcart -type f -name '*.apk' | sort)
          [ "${#apks[@]}" -eq 1 ] || fail "artifact $ARTIFACT_NAME of run $ARTIFACT_RUN holds ${#apks[@]} .apk files (need exactly 1)"
          apk="${apks[0]}"
          unzip -Z1 "$apk" > apk_list.txt 2>/dev/null || fail "$(basename "$apk") is not a valid zip/APK"
          abis=$(sed -n 's|^lib/\([^/]*\)/.*|\1|p' apk_list.txt | sort -u | paste -sd' ' -)
          echo "APK $(basename "$apk"), native ABIs: ${abis:-none}"
          if [ "$STATIC_ONLY" != 'true' ] && ! grep -qw x86_64 <<< "$abis"; then
            fail "no x86_64 lib in $(basename "$apk") (ABIs: ${abis:-none}); the emulator is x86_64: build it with add_archs x86_64, or set static_only"
          fi
          mkdir -p apkin && cp "$apk" apkin/

      - name: Re-upload the APK as an artifact of this run
        uses: actions/upload-artifact@v4
        with:
          name: apk-input-${{ github.run_number }}-a${{ github.run_attempt }}
          path: apkin/*.apk
          retention-days: 3
          if-no-files-found: error

  inspect:
    needs: [check, build, fetch]
    if: >-
      always() && needs.check.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && (needs.fetch.result == 'success' || needs.fetch.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      LABEL: ${{ inputs.label }}
      APK_URL: ${{ inputs.apk_url }}
      STATIC_ONLY: ${{ inputs.static_only }}
      API_LEVEL: ${{ inputs.api_level }}
      PROFILE: ${{ inputs.profile }}
      TAPS: ${{ inputs.taps }}
      LAUNCH_WAIT: ${{ inputs.launch_wait }}
      CACHE: ${{ inputs.cache }}
      APK_HIT: ${{ needs.build.outputs.apk_hit || 'n/a' }}
      COLD: ${{ needs.build.outputs.cold || 'n/a' }}
      CACHES: ${{ needs.build.outputs.caches || 'n/a' }}
      IMAGE_DIGEST: ${{ needs.build.outputs.image_digest || 'n/a (APK input, no build)' }}
      SRC_ID: ${{ needs.build.outputs.src_id || 'n/a (APK input, no build)' }}
      SOURCE: ${{ needs.check.outputs.source }}
      ARTIFACT_RUN: ${{ needs.check.outputs.artifact_run }}
      ARTIFACT_NAME: ${{ needs.check.outputs.artifact_name }}
      OUT: out
    outputs:
      shots: ${{ steps.res.outputs.shots }}
      # short, fixed-vocabulary values for the shots job's card page (no free text from logs)
      app_state: ${{ steps.res.outputs.app_state }}
      target_sdk: ${{ steps.res.outputs.target_sdk }}
      cold: ${{ steps.res.outputs.cold }}
      source: ${{ steps.res.outputs.source }}
    steps:
      - uses: actions/checkout@v4

      # build: build.yml's artifact; artifact source: the fetch job's re-upload (same path)
      - name: Get APK (artifact of this run)
        if: needs.check.outputs.source != 'apk_url'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact || needs.fetch.outputs.artifact }}
          path: apkdl

      - name: Get APK (apk_url)
        if: needs.check.outputs.source == 'apk_url'
        run: |
          mkdir -p apkdl
          curl -fsSL --proto '=https' --max-filesize 314572800 -o apkdl/download.apk "$APK_URL"

      - name: Static facts (aapt2 badging + bundled Python packages)
        run: |
          mkdir -p "$OUT"
          mapfile -t apks < <(find apkdl -name '*.apk' | sort)
          [ "${#apks[@]}" -gt 0 ] || { echo '::error::no APK found'; exit 1; }
          apk="${apks[0]}"
          echo "APK=$PWD/$apk" >> "$GITHUB_ENV"
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          "$aapt2" dump badging "$apk" > "$OUT/badging.txt"
          pkg=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" "$OUT/badging.txt")
          echo "PKG=$pkg" >> "$GITHUB_ENV"
          echo "TARGET_SDK=$(sed -n "s/^targetSdkVersion:'\([0-9]*\)'.*/\1/p" "$OUT/badging.txt")" >> "$GITHUB_ENV"
          echo "MIN_SDK=$(sed -n "s/^\(minSdkVersion\|sdkVersion\):'\([0-9]*\)'.*/\2/p" "$OUT/badging.txt" | head -1)" >> "$GITHUB_ENV"
          echo "ABIS=$(sed -n "s/^native-code: //p" "$OUT/badging.txt" | tr -d "'")" >> "$GITHUB_ENV"
          echo "APK_NAME=$(basename "$apk")" >> "$GITHUB_ENV"
          echo "APK_SHA=$(sha256sum "$apk" | cut -c1-64)" >> "$GITHUB_ENV"
          printf '%s\n' "${apks[@]}" > "$OUT/apks_found.txt"
          python3 tools/apk_pkgs.py "$apk" > "$OUT/python_packages.md"

      - name: Enable KVM
        if: inputs.static_only == false
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # emu_run.sh always exits 0 (results are files), so a failed step here = the emulator itself.
      # The action has no retry input: attempt 2 runs only when attempt 1 failed.
      - name: Emulator run (attempt 1)
        id: emu1
        if: inputs.static_only == false
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          arch: x86_64
          profile: ${{ inputs.profile }}
          cores: 4
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash tools/emu_run.sh

      - name: Emulator run (attempt 2)
        id: emu2
        if: inputs.static_only == false && steps.emu1.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          arch: x86_64
          profile: ${{ inputs.profile }}
          cores: 4
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash tools/emu_run.sh

      - name: Results + summary
        id: res
        if: always()
        env:
          EMU1: ${{ steps.emu1.outcome }}
          EMU2: ${{ steps.emu2.outcome }}
        run: |
          shots=false
          ls "$OUT"/*.png >/dev/null 2>&1 && shots=true
          echo "shots=$shots" >> "$GITHUB_OUTPUT"
          rd() { [ -f "$OUT/$1" ] && tr -d '\r' < "$OUT/$1" || echo "n/a"; }
          if [ "$COLD" = 'true' ]; then verdict='**COLD RUN (nothing restored from any cache): counts as evidence**';
          elif [ "$COLD" = 'n/a' ]; then verdict='APK input (no build): the APK itself is the input';
          else verdict='**WARM RUN (a cache was restored): not evidence (CLAUDE.md)**'; fi
          # App state at the end, as the FIRST summary line: a green workflow must not hide a dead app.
          state=''
          if [ "$STATIC_ONLY" != 'true' ]; then
            [ ! -f "$OUT/logcat.txt" ] || tr -d '\r' < "$OUT/logcat.txt" > "$OUT/logcat_clean.txt"
            pid=$(rd pid_at_end.txt)
            if [ "$pid" = 'none' ]; then
              state='**APP DIED: FAIL** (no app pid at the end)'
              # first exception line of the first Python traceback (logcat tag python)
              tb=$(grep -nE ' python *: Traceback' "$OUT/logcat_clean.txt" 2>/dev/null | head -1 | cut -d: -f1 || true)
              if [ -n "$tb" ]; then
                exc=$(sed -n "${tb},\$p" "$OUT/logcat_clean.txt" | grep -E ' python *: ' | sed -E 's/^.* python *: //' |
                      grep -m1 -E '^ *[A-Za-z_][A-Za-z0-9_.]*(Error|Exception|Exit|Interrupt)(:|$)' | cut -c1-200 || true)
                [ -z "$exc" ] || state="$state: \`$exc\`"
              fi
            elif [ "$pid" = 'not-installed' ]; then
              state="**APP NOT INSTALLED: FAIL** (install: \`$(rd install.txt | tail -1 | cut -c1-200)\`)"
            elif [ "$pid" = 'no-device' ]; then
              state='**ADB LOST DEVICE: UNKNOWN** (adb get-state was not `device` at the end)'
            elif [ "$pid" = 'n/a' ]; then
              state='**APP STATE UNKNOWN** (no pid_at_end.txt: the emulator run did not finish)'
            else
              state="**APP ALIVE at end** (pid $pid)"
            fi
            echo "app state: $state"
          fi
          # card one-liner pieces: a fixed word set, never log text
          case "$state" in
            '') short='static only' ;;
            *'APP DIED'*) short='APP DIED' ;;
            *'APP NOT INSTALLED'*) short='APP NOT INSTALLED' ;;
            *'ADB LOST DEVICE'*) short='ADB LOST DEVICE' ;;
            *'APP ALIVE'*) short='APP ALIVE' ;;
            *) short='APP STATE UNKNOWN' ;;
          esac
          case "$COLD" in true) cold='COLD run' ;; n/a) cold='APK input (no build)' ;; *) cold='WARM run' ;; esac
          sdk="${TARGET_SDK:-}"; [[ "$sdk" =~ ^[0-9]{1,3}$ ]] || sdk='?'
          # source for the card: validated inputs only (run ID digits, artifact name charset)
          case "$SOURCE" in artifact) src="from run $ARTIFACT_RUN artifact $ARTIFACT_NAME" ;; apk_url) src='from apk_url' ;; *) src='' ;; esac
          { echo "app_state=$short"; echo "target_sdk=$sdk"; echo "cold=$cold"; echo "source=$src"; } >> "$GITHUB_OUTPUT"
          {
            [ -z "$state" ] || { echo "$state"; echo; }
            echo "## inspect: $LABEL"
            echo
            echo '> **The emulator renders in SOFTWARE (SwiftShader), not on a real GPU (e.g. Adreno / Mali). GPU-driver and hardware bugs CANNOT show up here: a clean run here does not clear them.**'
            echo
            case "$SOURCE" in
              apk_url) from='apk_url' ;;
              artifact) from="artifact \`$ARTIFACT_NAME\` of run [$ARTIFACT_RUN](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/$ARTIFACT_RUN) (no rebuild)" ;;
              *) from="build \`$SRC_ID\`" ;;
            esac
            echo "- APK: \`$APK_NAME\` sha256 \`$APK_SHA\` (from: $from)"
            echo "- build image: \`$IMAGE_DIGEST\`"
            echo "- $verdict"
            echo "- cache input: \`$CACHE\`; per cache: $CACHES"
            echo "- inputs: static_only \`$STATIC_ONLY\`, api_level \`$API_LEVEL\`, profile \`$PROFILE\`, launch_wait \`$LAUNCH_WAIT\`, taps \`$TAPS\`"
            echo '### static facts'
            echo "- package \`$PKG\`, targetSdk \`$TARGET_SDK\`, minSdk \`$MIN_SDK\`, ABIs \`$ABIS\`"
            if [ "${TARGET_SDK:-0}" -ge 35 ] 2>/dev/null; then
              echo "- targetSdk >= 35: on Android 15+ (API 35+) the system ENFORCES edge-to-edge for this APK; the app draws under the status / navigation bars unless it handles insets."
            fi
            echo '<details><summary>permissions + full badging</summary>'
            echo
            echo '```'
            grep -E '^(uses-permission|launchable-activity|application:|native-code)' "$OUT/badging.txt" | cut -c1-200 || true
            echo '```'
            echo '</details>'
            echo
            echo '### bundled Python packages'
            cat "$OUT/python_packages.md"
            if [ "$STATIC_ONLY" != 'true' ]; then
              echo '### emulator run'
              echo "- emulator image: \`system-images;android-$API_LEVEL;google_apis;x86_64\`, fingerprint \`$(rd device_fingerprint.txt)\`, screen \`$(rd wm_size.txt)\`"
              echo "- attempts: 1 = \`$EMU1\`, 2 = \`${EMU2:-skipped}\`"
              echo "- install: \`$(rd install.txt | tail -1)\`; app pid at end: \`$(rd pid_at_end.txt)\` (none = not running = crashed or exited)"
              [ -f "$OUT/errors.txt" ] && { echo '- driver errors:'; echo '```'; cat "$OUT/errors.txt"; echo '```'; }
              echo "- screenshots: $(ls "$OUT"/*.png 2>/dev/null | wc -l) (sheet + raw links: the shots job summary below)"
              if [ -f "$OUT/logcat.txt" ]; then
                echo '#### logcat: Python tracebacks / errors / FATAL (first 40 hits)'
                echo '```'
                grep -nE 'Traceback|python *: .*(Error|Exception)|FATAL|Fatal signal|AndroidRuntime: |SIGSEGV' "$OUT/logcat_clean.txt" | cut -c1-300 | head -40 || true
                echo '```'
                tb=$(grep -nE ' python *: Traceback' "$OUT/logcat_clean.txt" | head -1 | cut -d: -f1 || true)
                if [ -n "$tb" ]; then
                  echo '#### first Python traceback'
                  echo '```'
                  sed -n "${tb},\$p" "$OUT/logcat_clean.txt" | grep -E ' python *: ' | head -30 | cut -c1-300
                  echo '```'
                else
                  echo '- no Python traceback in logcat'
                fi
                echo '#### app output lines tagged python (first 30)'
                echo '```'
                grep -E ' python *: ' "$OUT/logcat_clean.txt" | head -30 | cut -c1-300 || true
                echo '```'
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots + logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspect-${{ github.run_number }}
          path: out/
          retention-days: 14
          if-no-files-found: ignore

  # The ONLY job with write access: it pushes the PNGs to the orphan branch `shots`.
  shots:
    needs: [check, inspect]
    if: always() && needs.inspect.outputs.shots == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: inspect-${{ github.run_number }}
          path: out

      - uses: astral-sh/setup-uv@v6

      - name: Contact sheet
        run: |
          mkdir -p pub
          cp out/*.png pub/
          uv run --script tools/contact_sheet.py pub/sheet.png out/*.png

      # One Discord embed card per run (docs/cards.md), served by GitHub Pages from branch `shots`.
      # tools/card_page.py escapes every text value and allows only https URLs on known hosts.
      - name: Card page (index.html for Discord embeds)
        continue-on-error: true  # a card failure must not stop the screenshots push
        env:
          RUN_ID: ${{ github.run_id }}
          LABEL: ${{ inputs.label }}
          COLD: ${{ needs.inspect.outputs.cold }}
          APP_STATE: ${{ needs.inspect.outputs.app_state }}
          TARGET_SDK: ${{ needs.inspect.outputs.target_sdk }}
          SRC: ${{ needs.inspect.outputs.source }}
          ARTIFACT_RUN: ${{ needs.check.outputs.artifact_run }}
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"; name="${GITHUB_REPOSITORY#*/}"
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/shots/shots/$RUN_ID"
          pages_host="${owner,,}.github.io"
          page="https://${pages_host}/${name}/shots/$RUN_ID/"
          n=0; imgs=()
          for f in $(cd pub && ls *.png | sort); do
            [ "$f" = sheet.png ] || { n=$((n + 1)); imgs+=("--img=$raw/$f"); }
          done
          desc="$COLD · $APP_STATE · targetSdk $TARGET_SDK · $n screenshot(s)${SRC:+ · $SRC}"
          src_link=()
          [ -z "$ARTIFACT_RUN" ] || src_link=("--link=source run (APK artifact)=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/$ARTIFACT_RUN")
          uv run --no-project tools/card_page.py pub/index.html --allow-host "$pages_host" \
            --title="${LABEL:-inspect run $RUN_ID}" --description="$desc" --image="$raw/sheet.png" --url="$page" "${imgs[@]}" \
            --link="run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/$RUN_ID" --link="raw contact sheet=$raw/sheet.png" "${src_link[@]}"
          echo "PAGE_URL=$page" >> "$GITHUB_ENV"

      - name: Push to branch shots (shots/<run_id>/)
        env:
          TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init -q shotsrepo
          cd shotsrepo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "$url"
          if git ls-remote --exit-code origin refs/heads/shots >/dev/null 2>&1; then
            git fetch -q --depth 1 origin shots
            git checkout -q -b shots FETCH_HEAD
          else
            git checkout -q --orphan shots
            printf '# shots\nScreenshots pushed by inspect.yml runs (shots/<run_id>/). Orphan branch: no code.\n' > README.md
            git add README.md
          fi
          # Pages serves the branch as-is (no Jekyll build) when .nojekyll exists at its root
          [ -f .nojekyll ] || { : > .nojekyll; git add .nojekyll; }
          mkdir -p "shots/$RUN_ID"
          cp ../pub/*.png "shots/$RUN_ID/"
          [ ! -f ../pub/index.html ] || cp ../pub/index.html "shots/$RUN_ID/"
          git add "shots/$RUN_ID"
          git commit -q -m "shots for run $RUN_ID"
          for _ in 1 2 3; do
            git push -q origin HEAD:shots && exit 0
            git fetch -q --depth 1 origin shots && git rebase -q FETCH_HEAD || true
          done
          echo '::error::push to shots failed'; exit 1

      - name: Summary (screenshot URLs)
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/shots/shots/$RUN_ID"
          # also to stdout, so `gh run view --log` shows the links without opening the summary
          echo "contact sheet: $base/sheet.png"
          PAGE_URL="${PAGE_URL:-none (the Card page step failed)}"
          echo "card page (post this bare in Discord once it loads in a browser; Pages deploys ~1+ min after the push): $PAGE_URL"
          for f in $(cd pub && ls *.png | sort); do
            [ "$f" = sheet.png ] || echo "screenshot: $base/$f"
          done
          {
            echo '## screenshots'
            echo '**Software-rendered emulator (SwiftShader): GPU-driver / hardware bugs cannot show up here.**'
            echo
            echo "Discord card page (post this URL bare: one embed with title, result line and the sheet): $PAGE_URL"
            echo "(Pages deploys ~1+ minute after the push: open the URL in a browser first and post it only once it loads; posted too early, Discord caches an empty embed: post it again with \`?1\` appended. Enable Pages once: Settings -> Pages -> Deploy from a branch -> \`shots\`, / (root). docs/cards.md)"
            echo
            echo "Contact sheet (paste this raw link in Discord, it unfurls as an image): $base/sheet.png"
            echo
            echo "![contact sheet]($base/sheet.png)"
            echo
            for f in $(cd pub && ls *.png | sort); do
              [ "$f" = sheet.png ] || echo "- $base/$f"
            done
          } >> "$GITHUB_STEP_SUMMARY"
